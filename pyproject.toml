[project]
name = "dilseries"
version = "0.1.2"
description = "Import qPCR dilution series exports (Flow, cobas 5800, LC Pro) and assemble them into Excel overviews."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "openpyxl>=3.1.5",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
